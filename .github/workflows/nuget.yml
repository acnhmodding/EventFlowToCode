name: Publish AcnhModding.EventFlowToCode.Core to NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build solution
        shell: bash
        run: dotnet build EventFlowToCode.slnx --configuration Release -p:Version="${PACKAGE_VERSION#v}" -p:ContinuousIntegrationBuild=true

      - name: Pack Core
        shell: bash
        run: dotnet pack EventFlowToCode.Core/EventFlowToCode.Core.csproj --configuration Release --no-build -p:Version="${PACKAGE_VERSION#v}" -p:ContinuousIntegrationBuild=true --output artifacts

      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
